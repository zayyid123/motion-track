<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-labelledby="motionTrackLogo">
  <title id="motionTrackLogo">motion-track — isometric animated sticker studio</title>
  <defs>
    <linearGradient id="mtTopFace" x1="11" y1="12" x2="37" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc247"/>
      <stop offset="1" stop-color="#ff9050"/>
    </linearGradient>
    <linearGradient id="mtRightFace" x1="26" y1="20" x2="38" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6b35"/>
      <stop offset="1" stop-color="#ef5a22"/>
    </linearGradient>
  </defs>

  <g transform="translate(24 24) scale(1.2) translate(-24 -20.7)">
